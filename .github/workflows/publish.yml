---
# Publish a release: the package to npm and the MCP Registry, and the container image to Docker Hub
# (edubase/mcp) and GitHub Packages (ghcr.io/edubase/mcp). The two jobs run independently once the
# release passes its checks. Run it by hand to retry or rebuild a release: whatever is already on npm
# and the MCP Registry is skipped, and latest only moves for the newest release.
# npm trusted publishing is tied to the name of this file: renaming it needs the same change on npm.
name: Publish
run-name: Publishing ${{ inputs.tag || github.ref_name }}
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. 2.0.10)
        required: true
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latest: ${{ steps.release.outputs.latest }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check release tag
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag: $TAG"; exit 1; }
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: Check release
        id: release
        run: |
          # The tag is the version the sources and the MCP Registry entry state
          [[ "$(jq -r .version package.json)" == "$TAG" ]] || { echo "::error::package.json is not at version $TAG"; exit 1; }
          [[ "$(jq -r .version server.json)" == "$TAG" ]] || { echo "::error::server.json is not at version $TAG"; exit 1; }
          [[ "$(jq -r '.packages[0].version' server.json)" == "$TAG" ]] || { echo "::error::The npm package in server.json is not at version $TAG"; exit 1; }
          # Only the newest release may move latest
          newest="$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [[ "$TAG" == "$newest" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is older than $newest, latest stays where it is"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run tests
        run: |
          npm ci
          npm test
  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Publish package to npm
        run: |
          PACKAGE="$(jq -r .name package.json)@$TAG"
          if [ -n "$(npm view "$PACKAGE" version 2>/dev/null)" ]; then
            echo "$PACKAGE is already published to npm, skipping"
          else
            npm publish
          fi
      - name: Wait for package to appear on npm
        run: |
          PACKAGE="$(jq -r .name package.json)@$TAG"
          for i in $(seq 1 30); do
            if [ -n "$(npm view "$PACKAGE" version --prefer-online 2>/dev/null)" ]; then
              echo "$PACKAGE is available on npm"
              exit 0
            fi
            echo "Waiting for $PACKAGE to appear on npm ($i/30)..."
            sleep 10
          done
          echo "$PACKAGE did not appear on npm in time"
          exit 1
      - name: Check MCP Registry
        id: registry
        run: |
          # The registry refuses a version it already has
          name="$(jq -r '.name | @uri' server.json)"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$name/versions/$TAG" || true)"
          if [[ "$code" == "200" ]]; then
            echo "$TAG is already published to the MCP Registry, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mcp-publisher
        if: steps.registry.outputs.published != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        if: steps.registry.outputs.published != 'true'
        run: |
          for i in $(seq 1 6); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish attempt $i/6 failed, retrying in 30 seconds..."
            sleep 30
          done
          echo "Failed to publish server to MCP Registry"
          exit 1
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    timeout-minutes: 30
    env:
      TEST_IMAGE: edubase-mcp:test
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      # OIDC: the GitHub token is exchanged for a Docker Hub token that outlives the build (the default is 5 minutes)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: 1800
        with:
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
      # GitHub refuses app tokens here: "installation not allowed to Create organization package"
      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          provenance: false
          tags: ${{ env.TEST_IMAGE }}
      - name: Test image
        run: .github/scripts/test-image.sh "$TEST_IMAGE" "$TAG"
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            edubase/mcp
            ghcr.io/edubase/mcp
          flavor: latest=${{ needs.check.outputs.latest }}
          tags: type=semver,pattern={{version}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=EduBase MCP server
            org.opencontainers.image.revision=${{ needs.check.outputs.commit }}
          annotations: |
            org.opencontainers.image.title=EduBase MCP server
            org.opencontainers.image.revision=${{ needs.check.outputs.commit }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Check registries
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          # Both registries serve the image that was built
          echo "Image \`$DIGEST\`, latest moved: $LATEST" >> "$GITHUB_STEP_SUMMARY"
          for image in edubase/mcp ghcr.io/edubase/mcp; do
            digest="$(docker buildx imagetools inspect "$image:$TAG" --format '{{.Manifest.Digest}}')"
            [[ "$digest" == "$DIGEST" ]] || { echo "::error::$image:$TAG is $digest, not $DIGEST"; exit 1; }
            echo "- \`$image:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          done
