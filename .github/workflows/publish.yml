---
# Publish a release: the package to npm and the MCP Registry, and the container image to Docker Hub
# (edubase/mcp) and GitHub Packages (ghcr.io/edubase/mcp). The two jobs run independently once the
# release passes its checks, and the commit is only tagged after both of them succeeded.
# The Release workflow starts this after committing a version. Run it by hand with a version to retry
# or rebuild a release: whatever is already on npm and the MCP Registry is skipped, and latest only
# moves for the newest release.
# npm trusted publishing is tied to the name of this file: renaming it needs the same change on npm.
name: Publish
run-name: Publishing ${{ github.event.client_payload.version || inputs.version }}
on:
  repository_dispatch:
    types:
      - release
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish (e.g. 2.0.10)
        required: true
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: read
env:
  VERSION: ${{ github.event.client_payload.version || inputs.version }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latest: ${{ steps.release.outputs.latest }}
      commit: ${{ steps.commit.outputs.commit }}
      tagged: ${{ steps.commit.outputs.tagged }}
    steps:
      - name: Check release version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release version: $VERSION"; exit 1; }
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Find release commit
        id: commit
        run: |
          # The tag once there is one, otherwise the first commit on main with the version in both files: later merges keep the version, but are not part of the release
          if commit="$(git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}")"; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            commit=""
            for candidate in $(git log --first-parent --reverse --format=%H -G "\"version\": \"$VERSION\"" -- package.json server.json); do
              if [[ "$(git show "$candidate:package.json" | jq -r .version)" == "$VERSION" && "$(git show "$candidate:server.json" | jq -r .version)" == "$VERSION" ]]; then
                commit="$candidate"
                break
              fi
            done
            [[ -n "$commit" ]] || { echo "::error::No commit on main sets version $VERSION"; exit 1; }
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          jq -r .version package.json > "$RUNNER_TEMP/main-version"
          git checkout --quiet "$commit"
      - name: Check release
        id: release
        run: |
          # The version the sources and the MCP Registry entry state
          [[ "$(jq -r .version package.json)" == "$VERSION" ]] || { echo "::error::package.json is not at version $VERSION"; exit 1; }
          [[ "$(jq -r .version server.json)" == "$VERSION" ]] || { echo "::error::server.json is not at version $VERSION"; exit 1; }
          [[ "$(jq -r '.packages[0].version' server.json)" == "$VERSION" ]] || { echo "::error::The npm package in server.json is not at version $VERSION"; exit 1; }
          # Only the newest release may move latest, which might not be tagged yet
          newest="$( { git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; cat "$RUNNER_TEMP/main-version"; echo "$VERSION"; } | sort -V | tail -n 1)"
          if [[ "$VERSION" == "$newest" ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$VERSION is older than $newest, latest stays where it is"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run tests
        run: |
          npm ci
          npm test
  package:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Publish package to npm
        run: |
          PACKAGE="$(jq -r .name package.json)@$VERSION"
          if [ -n "$(npm view "$PACKAGE" version 2>/dev/null)" ]; then
            echo "$PACKAGE is already published to npm, skipping"
          else
            npm publish
          fi
      - name: Wait for package to appear on npm
        run: |
          PACKAGE="$(jq -r .name package.json)@$VERSION"
          for i in $(seq 1 30); do
            if [ -n "$(npm view "$PACKAGE" version --prefer-online 2>/dev/null)" ]; then
              echo "$PACKAGE is available on npm"
              exit 0
            fi
            echo "Waiting for $PACKAGE to appear on npm ($i/30)..."
            sleep 10
          done
          echo "$PACKAGE did not appear on npm in time"
          exit 1
      - name: Check MCP Registry
        id: registry
        run: |
          # The registry refuses a version it already has
          name="$(jq -r '.name | @uri' server.json)"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$name/versions/$VERSION" || true)"
          if [[ "$code" == "200" ]]; then
            echo "$VERSION is already published to the MCP Registry, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mcp-publisher
        if: steps.registry.outputs.published != 'true'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        if: steps.registry.outputs.published != 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        if: steps.registry.outputs.published != 'true'
        run: |
          for i in $(seq 1 6); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish attempt $i/6 failed, retrying in 30 seconds..."
            sleep 30
          done
          echo "Failed to publish server to MCP Registry"
          exit 1
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    timeout-minutes: 30
    env:
      TEST_IMAGE: edubase-mcp:test
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
      # OIDC: the GitHub token is exchanged for a Docker Hub token that outlives the build (the default is 5 minutes)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: 1800
        with:
          username: ${{ vars.DOCKERHUB_OIDC_USERNAME }}
      # GitHub refuses app tokens here: "installation not allowed to Create organization package"
      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          provenance: false
          tags: ${{ env.TEST_IMAGE }}
      - name: Test image
        run: .github/scripts/test-image.sh "$TEST_IMAGE" "$VERSION"
      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            edubase/mcp
            ghcr.io/edubase/mcp
          flavor: latest=${{ needs.check.outputs.latest }}
          tags: type=semver,pattern={{version}},value=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.title=EduBase MCP server
            org.opencontainers.image.revision=${{ needs.check.outputs.commit }}
          annotations: |
            org.opencontainers.image.title=EduBase MCP server
            org.opencontainers.image.revision=${{ needs.check.outputs.commit }}
      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Check registries
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          # Both registries serve the image that was built
          echo "Image \`$DIGEST\`, latest moved: $LATEST" >> "$GITHUB_STEP_SUMMARY"
          for image in edubase/mcp ghcr.io/edubase/mcp; do
            digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}')"
            [[ "$digest" == "$DIGEST" ]] || { echo "::error::$image:$VERSION is $digest, not $DIGEST"; exit 1; }
            echo "- \`$image:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          done
  tag:
    needs:
      - check
      - package
      - image
    if: needs.check.outputs.tagged != 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    steps:
      # The tag ruleset only lets the release app create tags
      - name: Create token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
          token: ${{ steps.app.outputs.token }}
      - name: Tag release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "${TITLE:-Release $VERSION}"
          git push origin "refs/tags/$VERSION"
          echo "Tagged [$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$VERSION)" >> "$GITHUB_STEP_SUMMARY"
