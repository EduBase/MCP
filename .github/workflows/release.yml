---
# Release the server when a pull request labelled major, minor or patch is merged: the next version
# gets its own tag, which starts the npm, MCP Registry and container image workflows. Without one of
# these labels nothing happens.
# pull_request_target also has the secrets for pull requests from forks. It is safe here, as the job
# only runs after the merge and only checks out main.
name: Release
run-name: Releasing pull request ${{ github.event.pull_request.number }}
on:
  pull_request_target:
    types:
      - closed
    branches:
      - main
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      (contains(github.event.pull_request.labels.*.name, 'major') ||
      contains(github.event.pull_request.labels.*.name, 'minor') ||
      contains(github.event.pull_request.labels.*.name, 'patch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Tags pushed with GITHUB_TOKEN would start no workflows
      - name: Create token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.EDUBASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.EDUBASE_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Create release tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The largest label wins (labels match case-insensitively in the job condition too)
          case ",${LABELS,,}," in
            *,major,*) level="major" ;;
            *,minor,*) level="minor" ;;
            *) level="patch" ;;
          esac
          version="$(.github/scripts/release-version.sh "$level")"
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # main only takes reviewed pull requests, so the version change lives on the tag alone
          if ! git diff --quiet -- package.json server.json; then
            git commit -m "Release $version" -- package.json server.json
          fi
          git tag -a "$version" -m "$TITLE"
          git push origin "refs/tags/$version"
          echo "Released [$version]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$version) ($level)" >> "$GITHUB_STEP_SUMMARY"
