---
# Release the server when a pull request labelled major, minor or patch is merged: the next version
# is committed to main and the Publish workflow is started, which tags the commit and creates a GitHub
# release once everything is published. Without one of these labels nothing happens.
# pull_request_target also has the secrets for pull requests from forks. It is safe here, as the job
# only runs after the merge and only runs code from main: the pull request's package.json is only read.
# The release app can skip the pull request rule of main, so it is only available in this job: its
# credentials live in the release environment, which only main can use.
name: Release
run-name: Releasing pull request ${{ github.event.pull_request.number }}
on:
  pull_request_target:
    types:
      - closed
    branches:
      - main
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: >-
      github.event.pull_request.merged &&
      (contains(github.event.pull_request.labels.*.name, 'major') ||
      contains(github.event.pull_request.labels.*.name, 'minor') ||
      contains(github.event.pull_request.labels.*.name, 'patch'))
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    steps:
      # Pushes with GITHUB_TOKEN could not skip the rule, and its events would start no workflows
      - name: Create token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Commit release version
        id: release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # The largest label wins (labels match case-insensitively in the job condition too)
          case ",${LABELS,,}," in
            *,major,*) level="major" ;;
            *,minor,*) level="minor" ;;
            *) level="patch" ;;
          esac
          # A version set by hand is one this pull request changed, whichever way it was merged
          git fetch --quiet origin "refs/pull/$NUMBER/head"
          proposed="$(git show FETCH_HEAD:package.json | jq -r .version)"
          before="$(git show "$(git merge-base "$BASE" FETCH_HEAD):package.json" | jq -r .version)"
          requested=""
          if [[ "$proposed" != "$before" ]]; then
            requested="$proposed"
          fi
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # Start over when another merge reaches main first
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            version="$(.github/scripts/release-version.sh "$level" "$requested")"
            if git diff --quiet -- package.json server.json; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "Release $version" -- package.json server.json
            if git push origin HEAD:main; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $attempt/5 failed, trying again..."
            sleep 5
          done
          echo "::error::Could not push the release to main"
          exit 1
      - name: Start publishing
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=release -f "client_payload[version]=$VERSION" -f "client_payload[title]=$TITLE"
          echo "Publishing $VERSION" >> "$GITHUB_STEP_SUMMARY"
