name: Publish to MCP Registry

on:
  push:
    tags: ["*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Publish MCP package to npm
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Publish package to npm
        run: |
          PACKAGE="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "$PACKAGE" version 2>/dev/null)" ]; then
            echo "$PACKAGE is already published to npm, skipping"
          else
            npm publish
          fi
      - name: Wait for package to appear on npm
        run: |
          PACKAGE="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if [ -n "$(npm view "$PACKAGE" version --prefer-online 2>/dev/null)" ]; then
              echo "$PACKAGE is available on npm"
              exit 0
            fi
            echo "Waiting for $PACKAGE to appear on npm ($i/30)..."
            sleep 10
          done
          echo "$PACKAGE did not appear on npm in time"
          exit 1

      # Publish MCP server to MCP Registry
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: |
          for i in $(seq 1 6); do
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "Publish attempt $i/6 failed, retrying in 30 seconds..."
            sleep 30
          done
          echo "Failed to publish server to MCP Registry"
          exit 1
